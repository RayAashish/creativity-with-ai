<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="ribbon-card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="porcelain" cx="50%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <linearGradient id="rainbow-spectrum" x1="60" y1="360" x2="450" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="20%" stop-color="#00BAF8" />
      <stop offset="42%" stop-color="#4F46E5" />
      <stop offset="65%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#EC4899" />
      <stop offset="92%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
  </defs>

  <!-- Porcelain Squircle Card -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#porcelain)" filter="url(#shadow-card)" stroke="#E2E8F0" stroke-width="2.5" />

  <!-- Master Floating Ink Ribbon - Scaled 0.70x & Centered, Tilted -25 deg -->
  <g filter="url(#ribbon-card-shadow)" transform="translate(256, 256) rotate(-25) scale(0.70) translate(-256, -256)">
    <path d="M 66,256 
             C 66,310 105,354 150,354 
             C 192,354 225,310 256,256 
             C 287,202 320,158 362,158 
             C 407,158 446,202 446,256 
             C 446,310 407,354 362,354 
             C 320,354 287,310 256,256 
             C 225,202 192,158 150,158 
             C 105,158 66,202 66,256 Z"
          fill="none"
          stroke="url(#rainbow-spectrum)"
          stroke-width="64"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <path d="M 270,236 
             C 305,190 330,166 366,166 
             C 405,166 430,198 434,242"
          fill="none"
          stroke="url(#sheen)"
          stroke-width="12"
          stroke-linecap="round" />

    <path d="M 80,242 
             C 84,198 108,166 146,166 
             C 176,166 205,188 236,230"
          fill="none"
          stroke="url(#sheen)"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.75" />

    <g transform="translate(382, 146)">
      <circle cx="0" cy="0" r="22" fill="#FBBF24" opacity="0.35" filter="url(#sparkle-glow)" />
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" opacity="0.6" filter="url(#sparkle-glow)" />
      <polygon points="0,-22 4.5,-5 22,0 4.5,5 0,22 -4.5,5 -22,0 -4.5,-5" fill="#FFFFFF" />
      <polygon points="0,-12 2.5,-3 12,0 2.5,3 0,12 -2.5,3 -12,0 -2.5,-3" fill="#FBBF24" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
