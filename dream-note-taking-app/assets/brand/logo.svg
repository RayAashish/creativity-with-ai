<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Soft Porcelain -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>

    <!-- Electric Indigo / Violet Ribbon Gradient -->
    <linearGradient id="indigoViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Sunset Amber / Coral Rose Gradient -->
    <linearGradient id="amberCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="75%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Emerald Aperture Gradient -->
    <linearGradient id="emeraldMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Collar Gradient -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Crisp Porcelain White Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#E2E8F0" stroke-width="2" />

  <!-- Multi-Color Emblem Group -->
  <g id="brand-symbol">
    <!-- Left Wing (Indigo-Violet Ribbon) -->
    <path d="M 256,114
             L 250,123
             C 235,142 201,204 170,244
             C 152,266 135,278 118,285
             C 125,321 149,371 185,406
             L 249,373
             L 249,273
             C 235,268 225,257 225,242
             C 225,228 235,216 249,211
             L 249,114 Z"
          fill="url(#indigoViolet)" />

    <!-- Right Wing (Sunset Amber-Coral Ribbon) -->
    <path d="M 256,114
             L 262,123
             C 277,142 311,204 342,244
             C 360,266 377,278 394,285
             C 387,321 363,371 327,406
             L 263,373
             L 263,273
             C 277,268 287,257 287,242
             C 287,228 277,216 263,211
             L 263,114 Z"
          fill="url(#amberCoral)" />

    <!-- Central Aperture -->
    <circle cx="256" cy="242" r="16" fill="url(#emeraldMint)" />
    <circle cx="256" cy="242" r="7" fill="#FFFFFF" />

    <!-- Stylus Collar Base -->
    <polygon points="204,401 308,401 296,420 216,420" fill="url(#collarGrad)" />
    <polygon points="223,425 289,425 284,434 228,434" fill="#0F172A" />
  </g>
</svg>
