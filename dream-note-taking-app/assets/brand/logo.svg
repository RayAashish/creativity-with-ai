<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1C1812" />
      <stop offset="60%" stop-color="#0E0F13" />
      <stop offset="100%" stop-color="#08090B" />
    </radialGradient>

    <!-- Molten Gold Metallic Gradient (Main Nib) -->
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Accent / Right Facet Shadow -->
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Luminous Ring Glow -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>

  <!-- Velvet Obsidian Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Outer Subtle Gold Ambient Glow Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FDE68A" stroke-width="1" stroke-opacity="0.08" />

  <!-- InkFlow Precision Diamond / Nib Symbol -->
  <g id="brand-symbol">
    <!-- Nib Left Wing / Tine -->
    <path d="M 256,108
             L 252,114
             C 246,128 220,192 188,232
             C 172,252 154,264 136,270
             C 142,306 166,368 200,404
             L 248,376
             L 248,272
             C 238,268 232,258 232,246
             C 232,234 240,224 252,221
             L 252,108 Z"
          fill="url(#goldMain)" />

    <!-- Nib Right Wing / Tine -->
    <path d="M 256,108
             L 260,114
             C 266,128 292,192 324,232
             C 340,252 358,264 376,270
             C 370,306 346,368 312,404
             L 264,376
             L 264,272
             C 274,268 280,258 280,246
             C 280,234 272,224 260,221
             L 260,108 Z"
          fill="url(#goldShadow)" />

    <!-- Precision Central Ink Slit & Breather Hole Negative Space -->
    <!-- (Slit runs between x=252 and x=260, hole at cx=256 cy=246 r=16) -->
    
    <!-- Central Optical Breather Core (Luminous Gold Anchor) -->
    <circle cx="256" cy="246" r="10" fill="url(#goldMain)" />
    <circle cx="256" cy="246" r="5" fill="#0E0F13" />

    <!-- Chamfered Base Collar (Stylus Anchor) -->
    <path d="M 216,400 L 296,400 L 286,420 L 226,420 Z" fill="url(#goldMain)" />
    <path d="M 234,424 L 278,424 L 274,432 L 238,432 Z" fill="url(#goldShadow)" />
  </g>
</svg>