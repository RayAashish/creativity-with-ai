[package]
name = "rust_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vtracer = "1.0.0-alpha.4"
visioncortex = "0.9.3"
image = { version = "0.25", default-features = false }
jni = "0.21.1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
